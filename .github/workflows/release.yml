name: Release XCFramework

# Cuts a release: builds the XCFramework from a branch, then tags a commit whose
# Package.swift points at it. Tags are made here, not pushed by hand: a hand-pushed
# tag has no binary and builds from source.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (major.minor.patch)
        required: true
        type: string
      ref:
        description: Branch or commit to release
        required: true
        default: main
        type: string
      dry_run:
        description: Build and check only; tag and publish nothing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xcframework-release-${{ inputs.version }}

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: xcode-27
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version in major.minor.patch form" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build XCFramework
        run: Scripts/build-xcframework.sh dist
      - name: Check the binary manifest resolves
        run: |
          Scripts/set-binary-release.sh "$VERSION" "$(cat dist/PVWebServer.xcframework.zip.sha256)"
          swift package dump-package > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: PVWebServer-XCFramework
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: PVWebServer-XCFramework
          path: dist
      - name: Tag a commit that points at the binary
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          Scripts/set-binary-release.sh "$VERSION" "$(cat dist/PVWebServer.xcframework.zip.sha256)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: $VERSION" Package.swift
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes
