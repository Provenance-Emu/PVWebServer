name: Release XCFramework

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xcframework-release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in major.minor.patch form" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - name: Build XCFramework
        run: Scripts/build-xcframework.sh dist release-source
      - uses: actions/upload-artifact@v4
        with:
          name: PVWebServer-XCFramework
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PVWebServer-XCFramework
          path: dist
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
